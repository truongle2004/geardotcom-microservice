spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://geardotcom_postgres:5432/geardotcom}
    username: postgres
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://discovery-service:8761/eureka}
payment:
    vnp_TmnCode: ${VNP_TMN_CODE}
    vnp_PayUrl: ${VNP_PAY_URL}
    vnp_SecretKey: ${VNP_SECRET_KEY}
    vnp_ApiUrl: ${VNP_API_URL}
    vnp_ReturnUrl: ${VNP_RETURN_URL}

server:
  port: 8082
